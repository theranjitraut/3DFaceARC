# configs/config.yaml
# FaceARCs - Face Analysis and Reconstruction Components System
# Configuration for unannotated single-view dataset

# ─────────────────────────────────────────
# DATASET
# ─────────────────────────────────────────
dataset:
  root_dir: "./data/images"          # folder containing raw face images
  image_size: 224                    # resize all images to this
  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  num_workers: 4
  augmentation: true

# ─────────────────────────────────────────
# 3DMM (Basel Face Model prior)
# ─────────────────────────────────────────
bfm:
  model_path: "./data/BFM/BFM09_model_info.mat"   # download separately
  n_shape: 80          # number of shape PCA components
  n_exp: 64            # number of expression components
  n_tex: 80            # number of texture components
  n_vertices: 35709    # BFM vertex count

# ─────────────────────────────────────────
# MODEL ARCHITECTURE
# ─────────────────────────────────────────
model:
  # CNN Backbone (feature extractor)
  backbone: "resnet50"               # resnet50 | resnet34 | efficientnet_b3
  pretrained: true
  feature_dim: 2048

  # 3DMM coefficient regressor
  coeff_dims:
    shape: 80
    exp: 64
    tex: 80
    angles: 3            # Euler angles
    translation: 3
    scale: 1

  # GCN Refinement Network
  gcn:
    num_layers: 4
    hidden_dim: 256
    dropout: 0.1
    heads: 4             # multi-head attention in GAT layers
    residual: true

# ─────────────────────────────────────────
# SELF-SUPERVISED TRAINING
# ─────────────────────────────────────────
training:
  epochs: 100
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: "cosine"    # cosine | step | plateau
  warmup_epochs: 5
  grad_clip: 1.0
  save_every: 5          # save checkpoint every N epochs
  device: "cuda"         # cuda | cpu

  # Loss weights (self-supervised, no annotations needed)
  loss_weights:
    photometric: 1.0      # re-render vs input pixel loss
    landmark: 0.5         # pseudo-landmark loss via mediapipe
    shape_reg: 0.1        # regularize 3DMM coefficients
    tex_reg: 0.1          # regularize texture coefficients
    smooth: 0.05          # mesh smoothness / Laplacian
    perceptual: 0.3       # VGG perceptual loss
    symmetry: 0.2         # face symmetry loss
    id_preserve: 0.5      # ArcFace identity preservation

# ─────────────────────────────────────────
# RENDERING
# ─────────────────────────────────────────
renderer:
  image_size: 224
  blur_radius: 0.0
  faces_per_pixel: 1

# ─────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────
paths:
  checkpoints: "./checkpoints"
  outputs: "./outputs"
  logs: "./logs"
  pretrained_arcface: "./data/pretrained/arcface_resnet50.pth"
